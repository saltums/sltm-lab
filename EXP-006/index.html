<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"DotGothic16",monospace}
*{font-family:"DotGothic16",monospace!important}
#app:after{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(#0000 0 2px,#0000002a 2px 3px)}
#app{height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:none;flex-direction:column}
.scr.on{display:flex}
.btn{padding:12px;font-size:16px;color:#fff;background:linear-gradient(#2b3fae,#101a66);border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000a;position:relative}
.btn:active:before{content:"▶";position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:12px;animation:bl .5s steps(1) infinite}
.btn.pri{color:#ffe14a}
.btn.g{color:#fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.exp{font-size:11px;letter-spacing:.3em;color:#777;font-family:sans-serif}
.big{font-size:44px;font-weight:900;letter-spacing:.06em}
.ttlname{font-size:30px;line-height:1.4;min-height:2.8em;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ttlN{color:#ffe08a;font-size:38px;word-break:break-all;cursor:pointer;padding:0 8px;border-bottom:2px dashed #ffe08a66}
#ttlN.pop{animation:pop .25s}
.ttlname .to{font-size:24px}
.rto{font-size:16px;color:#aaa;font-weight:400}
.small{font-size:13px;color:#ccc;line-height:1.8}
.blink{font-size:13px;letter-spacing:.2em;color:#ffe14a;animation:bl 1s steps(1) infinite}

/* ===== フィールド会話シーン ===== */
#field{background:#000}
#field .stage{flex:1;position:relative;overflow:hidden;background:linear-gradient(#5d8fc4 0%,#a9cbe6 55%,#dfeaf2 100%)}
#field svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%}
.msg{position:absolute;left:4%;width:auto;max-width:92%;background:linear-gradient(#2b3fae,#101a66);border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000a;padding:8px 14px 18px;font-size:16px;line-height:1.7;text-shadow:2px 2px 0 #000;color:#fff}
.msg:before{content:"";position:absolute;width:0;height:0;border:9px solid transparent;left:var(--tx,40px)}
.msg.down:before{top:100%;border-top:11px solid #c9c9c9;border-bottom:0}
.msg.up:before{bottom:100%;border-bottom:11px solid #c9c9c9;border-top:0}
.msg.none:before{display:none}
.msg .who{font-size:13px;color:#ffe14a}
.msg .nx{position:absolute;right:10px;bottom:6px;font-size:12px;animation:bl 1s steps(1) infinite}
.msg b{color:#ffe08a}
#skipF{position:absolute;top:10px;right:10px;font-size:13px;color:#fff;background:#101a66;border:2px solid #fff;padding:4px 10px;border-radius:4px;font-family:sans-serif;z-index:3}
.bubble{position:absolute;font-size:22px;animation:pop .3s}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

/* ===== 名前入力画面 ===== */
#entry{background:#15151c}
.top{flex:0 0 46%;position:relative;display:flex;background:linear-gradient(90deg,#dfe6ee,#f7f7f5 60%)}
.portrait{flex:0 0 54%;position:relative;overflow:hidden;background:url(hime.jpg) 40% 22%/cover no-repeat;-webkit-mask-image:linear-gradient(90deg,#000 78%,transparent);mask-image:linear-gradient(90deg,#000 78%,transparent);transition:filter .3s}
#pfx{position:absolute;inset:0;pointer-events:none;transition:background .3s}
#pmark{position:absolute;right:12%;top:24%;font-size:34px;filter:drop-shadow(0 2px 2px #0006)}
#pmark.pop{animation:pop .3s}
.portrait.dead{filter:grayscale(.85) brightness(.75)}
.portrait.dead #pfx{background:repeating-linear-gradient(90deg,#2a2a5a33 0 3px,transparent 3px 9px),linear-gradient(#3a3a7a66,transparent 45%)}
.portrait.fire #pfx{background:radial-gradient(ellipse at 50% 100%,#ff6a0088,transparent 65%)}
.portrait.shock{animation:sh .3s 2}
.portrait.smile #pfx{background:radial-gradient(circle at 70% 25%,#fff8,transparent 40%)}
.portrait.hmm{filter:saturate(.7)}
.portrait svg{position:absolute;inset:0;width:100%;height:100%}
.info{flex:1;color:#333;padding:12px 12px 0 0;font-size:12px;line-height:1.7;font-family:sans-serif;font-weight:700;text-align:right}
.info .k{color:#999;display:inline-block;width:46px}
.namebox{position:absolute;left:47%;right:8px;bottom:12px;color:#222;font-family:sans-serif}
.nrow{display:flex;align-items:flex-end;gap:6px}
.nrow .fld{flex:1;min-width:0}
.reset{width:34px;height:34px;border-radius:50%;border:none;background:#eee;box-shadow:0 2px 4px #0004;font-size:20px;color:#555;flex:0 0 34px}
.namebox .lb{font-size:24px;color:#222;font-style:italic;font-family:'Snell Roundhand','Brush Script MT',cursive;line-height:1}
.namebox .fld{border-bottom:1px solid #555;font-size:var(--fs,22px);font-weight:700;min-height:34px;padding:2px 0;word-break:break-all;line-height:1.2;display:flex;align-items:flex-end;gap:4px}
.namebox .fld .cur{width:2px;height:22px;background:#333;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.namebox .cnt{font-size:10px;color:#666;text-align:center;margin-top:6px;line-height:1.5}
.say{margin:8px 10px 0;background:linear-gradient(#2b3fae,#101a66);border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000a;padding:8px 12px;font-size:14px;min-height:46px;line-height:1.5}
.slots{display:flex;align-items:center;gap:6px;margin:8px 10px 0;font-size:14px}
.sl{min-width:56px;max-width:36%;padding:4px 8px;border:2px dashed #fff8;border-radius:4px;text-align:center;color:#fff6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl.on{border:2px solid #ffe14a;color:#ffe14a;background:#101a66}
.plus{color:#ffe14a}
.slh{font-size:10px;white-space:nowrap;color:#ffe14a;margin-left:auto;animation:bl 1.2s steps(1) infinite}
.slots .slh{flex-shrink:0}
@media (max-width:340px){.slh{display:none}}
.slh.done{animation:none;color:#888}
.stream{flex:1;position:relative;overflow:hidden;margin:8px 10px;background:#000;border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000}
.stream .hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:10px;color:#555;font-family:sans-serif}
.cm{position:absolute;white-space:nowrap;color:#fff;text-shadow:1px 1px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000;padding:4px 2px;will-change:transform}
.cm.gold{color:#ffd84a}
.cm.real{color:#ff9ad5}
.cm.hit{outline:2px solid #fff;border-radius:4px}
.cm.gag{color:#8fe3ff;animation:wob .5s ease-in-out infinite alternate}
.cm.longn{color:#c6f27a}
@keyframes wob{from{translate:0 -3px}to{translate:0 3px}}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 10px;min-height:0}
.card{background:#16161d;border:1px solid #444;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.2;text-align:center;font-family:sans-serif}
.card .ic{font-size:26px;line-height:1.1}
.card:active{transform:scale(.93);background:#333}
.card.ng{opacity:.25}
.card.real{border-color:#c9a24a}
.bar{display:flex;gap:8px;padding:0 10px 12px}
.bar .btn{flex:1;font-size:14px;padding:12px 6px}
.shake{animation:sh .25s}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#confirm{position:absolute;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}
#confirm.on{display:flex}
.dlg{background:linear-gradient(#2b3fae,#101a66);border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #000,inset 0 0 0 2px #000a;color:#fff;padding:18px 16px 16px;width:86%;text-align:center;position:relative;font-size:15px}
.dlg .nm{font-size:20px;margin:10px 0 16px;word-break:break-all;color:#ffe14a;line-height:1.3}
.dlg .row{display:flex;gap:10px;justify-content:center;min-height:48px}
#yes,#no{width:42%}
#no.run{position:absolute}

/* ムービー */
#movie{background:#000}
#mv{flex:1;position:relative;overflow:hidden}
#bubbles{position:absolute;inset:0}
.bb{position:absolute;max-width:86%!important;background:#fff;color:#111;border:3px solid #000;border-radius:2px;padding:6px 10px;font-size:14px;box-shadow:4px 4px 0 #0008;line-height:1.4;max-width:78%;box-shadow:0 3px 0 #0006;animation:bpop .25s ease-out}
.bb b{font-size:20px;color:#c0182a;word-break:break-all}
.bb .w{display:block;font-size:10px;color:#888}
.bb:after{content:"";position:absolute;bottom:-13px;left:22px;border:8px solid transparent;border-top:10px solid #000;border-bottom:0}
.bb.r:after{left:auto;right:22px}
@keyframes bpop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
#mvEnd{position:absolute;inset:0;background:#000;display:none;opacity:0;transition:opacity 1.2s ease;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center}
#mvEnd b{font-size:30px;color:#ffe08a;word-break:break-all;padding:0 20px}
#mvEnd .nxt{position:absolute;bottom:12%;font-size:12px;color:#ffe14a;animation:bl 1s steps(1) infinite}
#mvEnd .cr{letter-spacing:.1em;line-height:1.8;font-size:12px;color:#aaa}
#mvEnd span{font-size:12px;color:#888;letter-spacing:.3em;font-family:sans-serif}
#skip{position:absolute;right:10px;top:10px;font-size:13px;color:#fff;background:#101a66;border:2px solid #fff;padding:4px 10px;border-radius:4px;font-family:sans-serif;z-index:2}

#shareM{position:absolute;inset:0;background:#000c;z-index:35;display:none;align-items:center;justify-content:center}
#shareM.on{display:flex}
#shareM .sm{width:92%;font-size:13px;line-height:1.6}
#shareM img{width:100%;margin:10px 0;border:2px solid #fff;display:block}
#shareM .row2{display:flex;gap:8px}
#shareM .row2 .btn{flex:1;text-decoration:none;text-align:center}
#result .hl{font-size:13px;color:#fff;border:2px solid #fff;background:#101a66;padding:6px 10px;border-radius:4px;max-width:100%;word-break:break-all}
#result .col{font-size:12px;color:#aaa;margin-top:-8px}
#result .col .new{color:#ff6b6b;animation:bl .6s steps(1) infinite}
#result .ttl{font-size:28px;font-weight:900;color:#ffe08a;line-height:1.3}
#result .nm{font-size:30px;font-weight:900;word-break:break-all}
.meter{width:100%;font-family:sans-serif;font-size:12px;text-align:left}
.meter .row{display:flex;align-items:center;gap:8px;margin:6px 0}
.meter .row span:first-child{width:52px;color:#aaa}
.meter .b{flex:1;height:12px;background:#000;border:2px solid #fff;overflow:hidden}
.meter .b i{display:block;height:100%;-webkit-mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px);mask:repeating-linear-gradient(90deg,#000 0 6px,transparent 6px 8px)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:30;transition:opacity .4s ease}
#mute{position:absolute;left:8px;top:8px;z-index:20;width:36px;height:36px;border:2px solid #fff;border-radius:4px;background:#101a66;color:#fff;font-size:15px}
a.btn{text-decoration:none;display:block;text-align:center}
</style>
</head>
<body>
<div id="app">
<img id="cardHime" src="hime.jpg" alt="" style="display:none">
<div id="fade"></div>
<button id="mute" onclick="toggleMute()" aria-label="音声切替">🔊</button>

<div class="scr on" id="title">
  <div class="center">
    <div class="exp">sltm — EXP.006</div>
    <div class="big ttlname"><span id="ttlN" onclick="ttlTap()">〇〇</span><span class="to">と名乗ります。</span></div>
    <div class="small">城を抜け出した姫が<br>身分を隠すため、名前を変えるそうです。</div>
    <button class="btn pri" style="width:70%" onclick="startIntro()">はじめる</button>
    <div class="blink">PUSH START</div>
  </div>
</div>

<!-- フィールド -->
<div class="scr" id="field">
  <div class="stage" onclick="next()">
    <div id="skipF" onclick="event.stopPropagation();skipField()">SKIP ▶</div>
    <canvas id="fc" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
    <div class="msg" id="msg"><div class="who" id="who"></div><div id="line"></div><div class="nx">▼</div></div>
  </div>
</div>

<!-- 名前入力 -->
<div class="scr" id="entry">
  <div class="top">
    <div class="portrait" id="portrait"><div id="pfx"></div><div id="pmark"></div></div>
    <div class="info">
      <div>種族：人間</div><div>性別：女</div><div>年齢：16歳</div><div>利き腕：右利き</div>
    </div>
    <div class="namebox">
      <div class="lb">Name</div>
      <div class="nrow"><div class="fld" id="fld"><span id="nmTxt"></span><span class="cur"></span></div><button class="reset" onclick="toDefault()" aria-label="初期名に戻す">⟲</button></div>
      <div class="cnt">顔文字記号は使わないでください。<br>⟲：初期名に戻す</div>
    </div>
  </div>
  <div class="say"><span id="sayTxt"></span></div>
  <div class="slots"><span class="sl" id="sl0">？</span><span class="plus">＋</span><span class="sl" id="sl1">？</span><span class="slh">2つまでつなげられる</span></div>
  <div class="stream" id="stream"><div class="hint">流れてくる名前をタップ</div></div>
  <div class="bar">
        <button class="btn g" onclick="back1()">1つ消す</button>
        <button class="btn pri" onclick="askConfirm()">決定</button>
  </div>
  <div id="confirm"><div class="dlg">この名前でよろしいですか？<div class="nm" id="cfNm"></div><div class="row"><button class="btn pri" id="yes" onclick="yes()">はい</button><button class="btn" id="no">いいえ</button></div></div></div>
</div>

<div class="scr" id="movie">
  <div id="skip" onclick="skipMovie()">SKIP ▶</div>
  <div id="mv">
    <svg viewBox="0 0 400 700" preserveAspectRatio="xMidYMax slice" style="position:absolute;inset:0;width:100%;height:100%">
      <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12060a"/><stop offset=".6" stop-color="#5a1410"/><stop offset="1" stop-color="#c2461a"/></linearGradient></defs>
      <rect width="400" height="700" fill="url(#sky)"/>
      <g fill="#0b0406"><rect x="90" y="330" width="220" height="370"/><rect x="70" y="270" width="50" height="430"/><rect x="280" y="270" width="50" height="430"/><rect x="175" y="220" width="50" height="160"/>
      <polygon points="70,270 95,220 120,270"/><polygon points="280,270 305,220 330,270"/><polygon points="175,220 200,160 225,220"/>
      <rect x="0" y="600" width="400" height="100"/></g>
      <g fill="#ff7a2a" opacity=".85"><path d="M110,600 q15,-60 30,0z"/><path d="M250,600 q20,-80 40,0z"/><path d="M180,330 q12,-40 24,0z"/><path d="M300,420 q10,-35 20,0z"/></g>
    </svg>
    <div id="bubbles"></div>
    <div id="mvEnd"></div>
  </div>
</div>

<div id="shareM"><div class="dlg sm"><div>画像を長押しで保存して、<br>投稿に貼り付けてね</div><img id="shareImg" alt="結果画像"><div class="row2"><button class="btn" onclick="$('shareM').classList.remove('on')">とじる</button><a class="btn pri" id="shareGo" target="_blank" rel="noopener">Xを開く</a></div></div></div>
<div class="scr" id="result">
  <div class="center">
    <div class="exp">RESULT</div>
    <div class="nm"><span id="rNm"></span><br><span class="rto">と名乗ります。</span></div>
    <div class="ttl" id="rTtl"></div>
    <div class="col" id="rCol"></div>
    <div class="hl" id="rHl"></div>
    <div class="meter" id="meter"></div>
    <div class="small" id="rCom"></div>
    <div style="display:flex;gap:8px;width:100%"><button class="btn g" style="flex:1" onclick="startIntro()">もう一回</button><button class="btn pri" id="share" style="flex:1" onclick="shareX()">Xで名乗る</button></div>
  </div>
</div>

</div>
<script>
const REAL='ロザリンド', DEF='ナイフ', HERO='ルカ';
// コメント t:文字 s:強さ b:バカさ g:レア(速い・金色)

 else if(Math.random()<.08&&!isReal()){seq.push(['盗賊 '+HERO,'……いや待て。<br>さすがに名前のほうも直そうか。',['cThief','😰']],[H,'嫌ですわ',['cHime','😤']],['盗賊 '+HERO,'……だよな。',['cThief','😇']]);SUR=true}
 else if(parts.length===1&&SP[parts[0].t])seq.push(...SP[parts[0].t]);

}
