<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>深夜の自販機、打順。</title>
<meta name="description" content="深夜の自販機の9マスで、最強の打線を組む。">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#05070d;font-family:"M PLUS Rounded 1c",sans-serif;color:#eef}
#app{height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);
  background:radial-gradient(120% 60% at 50% 0%,#1c2440 0%,#0a0d18 60%,#05070d 100%);display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0;gap:8px}
.screen.on{display:flex}
.dot{font-family:"DotGothic16",monospace}
#mute{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:8px;z-index:20;width:40px;height:40px;border-radius:50%;border:1px solid #334;background:#0d1222cc;color:#cde;font-size:18px;display:flex;align-items:center;justify-content:center}
.btn{border:none;border-radius:12px;font-family:inherit;font-weight:800;font-size:19px;padding:14px 24px;min-height:52px;
  background:#e8452c;color:#fff;box-shadow:0 4px 0 #8c2414;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8c2414}
.btn:disabled{background:#3a4058;box-shadow:0 4px 0 #22263a;color:#8890a8}
.btn.sub{background:#24304e;box-shadow:0 4px 0 #121a2e;font-size:15px;padding:10px 14px}
.btn.x{background:#111;box-shadow:0 4px 0 #444;border:1px solid #444}

/* ===== vending machine ===== */
.vm{background:linear-gradient(#c8102e,#9b0c22);border-radius:14px 14px 6px 6px;padding:8px 8px 10px;box-shadow:0 0 0 2px #5a0613,0 0 40px #ff335522;position:relative}
.vm .head{display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:11px;padding:0 4px 6px;letter-spacing:.1em}
.vm .head b{font-size:13px;font-weight:800}
.vm .head .led{font-family:"DotGothic16",monospace;background:#120;color:#7f7;padding:1px 6px;border-radius:3px;font-size:12px;letter-spacing:.05em}
.case{background:linear-gradient(#e9f1ff,#c7d6ee);border-radius:6px;padding:6px 6px 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;box-shadow:inset 0 0 0 2px #fff8}
.slot{position:relative;border-radius:5px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-top:2px;min-height:0;transition:background .2s}
.slot .canwrap{height:58px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.slot .canwrap svg{height:56px;width:auto;transition:filter .4s,opacity .4s,transform .3s}
.slot .empty{width:30px;height:52px;border:2px dashed #93a3c0;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#7d8daa;font-size:18px;font-weight:800}
.slot .pl{font-family:"DotGothic16",monospace;font-size:12px;background:#111;color:#ffd84a;border-radius:3px;padding:0 4px;margin-top:2px;white-space:nowrap}
.slot .lamp{margin-top:2px;font-size:10px;border-radius:3px;padding:0 3px;color:#fff;font-weight:800;white-space:nowrap;min-width:52px;text-align:center;transition:background .4s}
.lamp.h{background:#e8302a}.lamp.c{background:#1f6fe0}.lamp.n{background:#7d8daa}
.slot.cur{background:#ffe86655;box-shadow:0 0 0 2px #ffcc00}
.slot.cur .canwrap svg{transform:translateY(-4px) scale(1.08)}
.slot.cut .canwrap svg{opacity:.18;filter:grayscale(1)}
.stamp{position:absolute;top:14px;left:50%;transform:translateX(-50%) rotate(-12deg);border:2px solid #d0021b;color:#d0021b;background:#fff;font-size:10px;font-weight:800;padding:0 3px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .2s}
.slot.cut .stamp{opacity:1}
.vm .foot{display:flex;gap:6px;margin-top:8px;align-items:center}
.vm .slotcoin{flex:1;height:30px;background:#2a0710;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#f99;font-family:"DotGothic16",monospace;overflow:hidden;white-space:nowrap}
.vm .tray{width:96px;height:30px;background:#111;border-radius:4px;border-top:4px solid #333;position:relative;overflow:hidden}
.vm .tray svg{position:absolute;height:24px;left:36px;top:-30px;transform:rotate(90deg)}
.vm .tray.drop svg{animation:drop .35s ease-in forwards}
@keyframes drop{to{top:-2px}}

/* ===== title ===== */
#title{justify-content:center;align-items:center;text-align:center;gap:14px}
#title h1{font-size:34px;font-weight:800;line-height:1.15;text-shadow:0 0 18px #ff4d6d88}
#title h1 small{display:block;font-size:13px;color:#9ab;font-weight:500;margin-bottom:6px;letter-spacing:.2em}
#title .vm{width:230px}
#title .vm .slot .canwrap{height:44px}#title .vm .slot .canwrap svg{height:42px}
#title p{font-size:13px;color:#9ab;line-height:1.6}

/* ===== edit ===== */
.hint{font-size:13px;color:#cde;text-align:center;min-height:20px;line-height:1.4}
.bench{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pick{background:#121a30;border:1px solid #2a3556;border-radius:10px;padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;color:#dde;font-size:11px;font-weight:800;min-height:78px;cursor:pointer}
.pick:active{background:#22305a}
.pick svg{height:44px;width:auto}
.pick .t{margin-top:1px;white-space:nowrap}
.pick .lamp{font-size:8px;margin-top:2px;padding:0 3px;border-radius:3px;color:#fff}
.row{display:flex;gap:8px}
.row .btn{flex:1}

/* ===== game ===== */
.board{margin-right:46px;display:grid;grid-template-columns:52px repeat(3,1fr) 52px;background:#0b1a10;border:2px solid #2d4a35;border-radius:6px;font-family:"DotGothic16",monospace;font-size:12px;text-align:center;color:#cfe}
.board div{padding:2px 0;border-right:1px solid #1f3626}
.board .v{color:#ffd84a;font-size:15px}
.board .on{background:#1e3a26}
.field{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;gap:8px;padding:4px 2px}
.cust{width:118px;flex:none;align-self:flex-end;transition:transform .5s}
.cust svg{width:118px;height:auto;display:block}
.cust.in{animation:walk .6s ease-out}
@keyframes walk{from{transform:translateX(-120px)}to{transform:none}}
.say{flex:1;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-width:0}
.bubble{background:#fff;color:#223;border-radius:12px;padding:7px 10px;font-size:13px;line-height:1.35;position:relative;font-weight:800}
.bubble:after{content:"";position:absolute;left:-8px;bottom:12px;border:6px solid transparent;border-right-color:#fff}
.res{font-size:20px;font-weight:800;text-align:center;min-height:30px;line-height:1.2}
.res small{display:block;font-size:14px;color:#9ab;font-weight:500}
.res.hr{color:#ffd84a;text-shadow:0 0 10px #ffb300}
.res.hit{color:#7ef0a0}.res.out{color:#8892aa}.res.bb{color:#9cc7ff}
.sys{font-size:11px;color:#9ab;text-align:center;min-height:16px}

/* ===== spring ===== */
.overlay{position:absolute;inset:0;background:#000d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10;text-align:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .4s}
.overlay.on{opacity:1;pointer-events:auto}
.overlay h2{font-size:24px;font-weight:800}
.overlay p{font-size:13px;color:#bcd;line-height:1.6}
.sakura{font-size:30px}

/* ===== result ===== */
#result{gap:7px}
.rhead{text-align:center}
.rhead .k{font-size:12px;color:#9ab;letter-spacing:.2em}
.rhead h2{font-size:23px;font-weight:800;line-height:1.25}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stat{background:#121a30;border-radius:8px;padding:5px 4px;text-align:center}
.stat .l{font-size:10px;color:#9ab}
.stat .n{font-family:"DotGothic16",monospace;font-size:19px;color:#ffd84a;line-height:1.15}
.stat .n.bad{color:#ff6b6b}
.notices{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-height:0}
.notice{width:30px;height:40px;background:#f4f1e6;color:#222;font-size:7px;font-weight:800;border-radius:2px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;box-shadow:0 1px 0 #999}
.notice svg{height:20px;width:auto}
.tsukkomi{font-size:11px;color:#ccd;text-align:center;line-height:1.5}
.others{background:#0d1324;border:1px solid #222c48;border-radius:8px;padding:6px 8px;font-size:12px;line-height:1.55;color:#bcd}
.others b{color:#fff;font-size:11px}
.others .r{display:flex;justify-content:space-between;gap:6px}
.others .r span:last-child{color:#ff8a8a;white-space:nowrap}
.others .r.me{color:#ffd84a}.others .r.me span:last-child{color:#ffd84a}
</style>
</head>
<body>
<div id="app">
  <button id="mute" aria-label="音">♪</button>

  <!-- TITLE -->
  <section id="title" class="screen on">
    <div class="vm"><div class="head"><b>のみもの</b><span class="led" id="clk0">02:14</span></div><div class="case" id="tcase"></div></div>
    <h1><small>EXP.005</small>深夜の自販機、<br>打順。</h1>
    <p>午前2時。来客は3人。<br>この打線で、冬から3月まで戦う。</p>
    <button class="btn" id="go">打順を組む</button>
  </section>

  <!-- EDIT -->
  <section id="edit" class="screen">
    <div class="vm"><div class="head"><b>スターティングメンバー</b><span class="led" style="margin-right:40px">冬</span></div><div class="case" id="ecase"></div></div>
    <div class="hint" id="ehint">缶をタップで1番から入る。同じ缶を何本入れてもいい。</div>
    <div class="bench" id="bench"></div>
    <div class="row"><button class="btn sub" id="clr">やり直す</button><button class="btn" id="play" disabled>プレイボール</button></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="board" id="board"></div>
    <div class="vm"><div class="head"><b id="ghead">冬季</b><span class="led" id="gclk">02:14</span></div><div class="case" id="gcase"></div>
      <div class="foot"><div class="slotcoin" id="coin">110円 入れてね</div><div class="tray" id="tray"></div></div></div>
    <div class="field">
      <div class="cust" id="cust"></div>
      <div class="say"><div class="bubble" id="bub">…</div><div class="res" id="res"></div><div class="sys" id="sys"></div></div>
    </div>
    <div class="overlay" id="ov"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="rhead"><div class="k" id="rk">シーズン終了</div><h2 id="rt"></h2></div>
    <div class="stats" id="stats"></div>
    <div class="notices" id="notices"></div>
    <div class="tsukkomi" id="tsk"></div>
    <div class="others" id="others"></div>
    <div class="row"><a class="btn x" id="share" href="#" target="_blank" rel="noopener" style="text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center">𝕏でシェア</a><button class="btn sub" id="again">もう一回</button></div>
  </section>
</div>

<script>
/* ===================== data ===================== */
// 現実の数字:ホット55℃前後/コールド5℃前後。ホットの列数は1台ごとにオペレーターが決める(全部ホットもあり)。
const POS=["中","二","遊","一","三","右","左","捕","投"];
const CANS={
  pota:{n:"コンポタ",hot:1,c1:"#f5c518",c2:"#d99a00",lb:"#fff3c4",ink:"#a86b00",corn:1},
  cof :{n:"微糖",hot:1,c1:"#5a3a22",c2:"#2b1a0e",lb:"#e9d3b4",ink:"#5a3a22"},
  shiru:{n:"おしるこ",hot:1,c1:"#8a2442",c2:"#5a1028",lb:"#f3d6dc",ink:"#8a2442"},
  lemon:{n:"ホットレモン",hot:1,c1:"#fff06a",c2:"#e7c800",lb:"#ffffff",ink:"#b39a00"},
  water:{n:"水",hot:0,c1:"#cfeeff",c2:"#8cc8ec",lb:"#ffffff",ink:"#3a8fcf"},
  ene :{n:"エナドリ",hot:0,c1:"#1b1b1b",c2:"#000",lb:"#38ff7a",ink:"#0b0b0b"},
  tea :{n:"緑茶",hot:0,c1:"#5fa443",c2:"#2f6a24",lb:"#e9f5df",ink:"#2f6a24"},
  soda:{n:"サイダー",hot:0,c1:"#3b8be8",c2:"#1d5fb8",lb:"#e6f2ff",ink:"#1d5fb8"},
};
const ORDER=["pota","cof","shiru","lemon","water","ene","tea","soda"];
// 来客(相手投手)
const CUST=[
  {k:"yoi",n:"酔っ払い",t:"02:14",line:"〆に、なんか<br>あったかいの…"},
  {k:"juken",n:"受験生",t:"02:51",line:"試験まで、あと<br>6時間…"},
  {k:"kei",n:"警備員",t:"03:30",line:"巡回中。<br>手がかじかむ…"},
];
// 打席結果 [結果, 理由]  HR/H/BB/GO/K
const TABLE={
  yoi:{pota:["HR","〆にしょっぱくて温かい"],cof:["GO","眠れなくなる"],shiru:["GO","甘すぎる"],lemon:["H","温まる"],
       water:["HR","酔い覚ましの正解"],ene:["K","これ以上は危ない"],tea:["H","さっぱり"],soda:["GO","腹が冷える"]},
  juken:{pota:["H","夜食になる"],cof:["HR","カフェイン"],shiru:["K","眠くなる"],lemon:["H","ビタミン"],
       water:["GO","味がしない"],ene:["H","まだ戦える"],tea:["GO","頭が冴えない"],soda:["GO","げっぷが出る"]},
  kei:{pota:["HR","手が温まる"],cof:["H","手が温まる"],shiru:["H","手が温まる"],lemon:["H","手が温まる"],
       water:["K","冷たくて持てない"],ene:["K","冷たくて持てない"],tea:["K","冷たくて持てない"],soda:["K","冷たくて持てない"]},
};
// 春(3月下旬):コールドに切り替え。ホット商品は戦力外。警備員は寒くないので冷たいのも買う
const SPRING_KEI={water:["H","春なので"],ene:["H","春なので"],tea:["HR","春なので"],soda:["H","春なので"]};
const RES={HR:{t:"ホームラン!",c:"hr"},H:{t:"ヒット",c:"hit"},BB:{t:"フォアボール",c:"bb"},GO:{t:"凡退",c:"out"},K:{t:"三振",c:"out"}};

/* ===================== svg ===================== */
let GID=0;
function canSVG(id,cold){
  const d=CANS[id],gid="g"+(GID++); let s=`<svg viewBox="0 0 40 70" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<defs><linearGradient id="${gid}" x1="0" x2="1"><stop offset="0" stop-color="${d.c2}"/><stop offset=".35" stop-color="${d.c1}"/><stop offset=".7" stop-color="${d.c1}"/><stop offset="1" stop-color="${d.c2}"/></linearGradient></defs>`;
  s+=`<rect x="5" y="6" width="30" height="60" rx="5" fill="url(#${gid})"/>`;
  s+=`<rect x="7" y="2" width="26" height="6" rx="2" fill="#c9ced8"/><rect x="15" y="3" width="10" height="2" rx="1" fill="#8a909c"/>`;
  s+=`<rect x="5" y="22" width="30" height="26" fill="${d.lb}"/>`;
  if(d.corn){for(let i=0;i<9;i++){s+=`<circle cx="${10+(i%3)*10}" cy="${27+Math.floor(i/3)*8}" r="3" fill="#ffd21a" stroke="#d9a400" stroke-width=".8"/>`}}
  else if(id==="water"){s+=`<path d="M20 26 C14 34 14 40 20 42 C26 40 26 34 20 26Z" fill="#7cc4f2"/>`}
  else if(id==="ene"){s+=`<path d="M22 24 L13 37 L19 37 L16 47 L27 32 L21 32 Z" fill="#111"/>`}
  else if(id==="tea"){s+=`<path d="M12 40 C12 28 26 26 28 28 C28 38 18 42 12 40Z" fill="#5fa443"/>`}
  else if(id==="soda"){for(let i=0;i<6;i++)s+=`<circle cx="${11+(i*7)%20}" cy="${28+i*3.2}" r="${1.5+(i%3)}" fill="none" stroke="#3b8be8" stroke-width="1.2"/>`}
  else if(id==="cof"){s+=`<ellipse cx="20" cy="35" rx="7" ry="9" fill="#5a3a22"/><path d="M20 27 C17 33 23 37 20 43" stroke="#e9d3b4" stroke-width="1.5" fill="none"/>`}
  else if(id==="shiru"){s+=`<circle cx="20" cy="35" r="9" fill="#5a1028"/><ellipse cx="20" cy="33" rx="6" ry="4" fill="#fff"/>`}
  else if(id==="lemon"){s+=`<ellipse cx="20" cy="35" rx="10" ry="7" fill="#ffe100" stroke="#c9a800"/><path d="M20 28 V42 M12 35 H28" stroke="#c9a800"/>`}
  s+=`<rect x="8" y="9" width="4" height="54" rx="2" fill="#fff" opacity=".22"/>`;
  if(cold){s+=`<rect x="5" y="6" width="30" height="60" rx="5" fill="#7fb8ff" opacity=".35"/>`;for(let i=0;i<7;i++)s+=`<circle cx="${9+(i*11)%24}" cy="${12+(i*17)%50}" r="1.4" fill="#fff" opacity=".9"/>`}
  return s+`</svg>`;
}
function custSVG(k){
  let s=`<svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<ellipse cx="50" cy="146" rx="34" ry="4" fill="#000" opacity=".5"/>`;
  if(k==="yoi"){
    s+=`<g transform="rotate(-6 50 140)"><rect x="30" y="62" width="40" height="58" rx="8" fill="#3b4256"/><path d="M50 62 L44 70 L50 104 L56 70Z" fill="#fff"/><path d="M50 66 L46 72 L50 98 L54 72Z" fill="#c62828"/>`;
    s+=`<rect x="34" y="118" width="12" height="28" fill="#2a2f3e"/><rect x="54" y="118" width="12" height="26" fill="#2a2f3e" transform="rotate(8 60 120)"/>`;
    s+=`<circle cx="50" cy="42" r="20" fill="#ffb59a"/><ellipse cx="42" cy="47" rx="5" ry="3" fill="#ff6f6f"/><ellipse cx="58" cy="47" rx="5" ry="3" fill="#ff6f6f"/>`;
    s+=`<path d="M41 40 q3 -3 6 0 M53 40 q3 -3 6 0" stroke="#333" stroke-width="2" fill="none"/><path d="M45 54 q5 4 10 0" stroke="#333" stroke-width="2" fill="none"/>`;
    s+=`<path d="M30 30 L70 24 L72 30 L32 36Z" fill="#c62828"/><rect x="68" y="68" width="8" height="36" rx="4" fill="#3b4256" transform="rotate(-30 72 70)"/>`;
    s+=`<rect x="80" y="40" width="10" height="16" rx="2" fill="#d8b04a"/><text x="84" y="22" font-size="14" fill="#ff9">♪</text></g>`;
  }else if(k==="juken"){
    s+=`<rect x="30" y="64" width="40" height="56" rx="10" fill="#4a5d8a"/><path d="M34 64 Q50 78 66 64" fill="#3a4a72"/>`;
    s+=`<rect x="36" y="118" width="11" height="28" fill="#2f3550"/><rect x="53" y="118" width="11" height="28" fill="#2f3550"/>`;
    s+=`<circle cx="50" cy="42" r="19" fill="#f6d2b6"/><path d="M29 44 Q28 18 50 18 Q72 18 71 44 L66 30 Q50 22 34 30Z" fill="#4a5d8a"/>`;
    s+=`<rect x="31" y="30" width="38" height="6" fill="#fff"/><circle cx="50" cy="33" r="3" fill="#d32f2f"/>`;
    s+=`<circle cx="43" cy="44" r="2" fill="#333"/><circle cx="57" cy="44" r="2" fill="#333"/><path d="M40 48 q3 2 6 0 M54 48 q3 2 6 0" stroke="#8a6aa8" stroke-width="1.5" fill="none"/>`;
    s+=`<rect x="14" y="78" width="24" height="30" rx="2" fill="#fff" stroke="#d32f2f" stroke-width="2" transform="rotate(-10 26 92)"/><path d="M18 86 h14 M18 92 h14 M18 98 h10" stroke="#888" transform="rotate(-10 26 92)"/>`;
  }else{
    s+=`<rect x="30" y="62" width="40" height="58" rx="8" fill="#26334f"/><path d="M33 64 L45 64 L58 118 L46 118Z M67 64 L55 64 L42 118 L54 118Z" fill="#d7ff3a" opacity=".85"/>`;
    s+=`<rect x="36" y="118" width="11" height="28" fill="#1c263c"/><rect x="53" y="118" width="11" height="28" fill="#1c263c"/>`;
    s+=`<circle cx="50" cy="44" r="18" fill="#e8bea0"/><rect x="30" y="22" width="40" height="14" rx="6" fill="#26334f"/><rect x="26" y="33" width="48" height="5" rx="2" fill="#1c263c"/><circle cx="50" cy="29" r="4" fill="#ffd84a"/>`;
    s+=`<circle cx="43" cy="46" r="2" fill="#333"/><circle cx="57" cy="46" r="2" fill="#333"/><path d="M45 54 h10" stroke="#333" stroke-width="2"/>`;
    s+=`<rect x="66" y="78" width="10" height="20" rx="2" fill="#555" transform="rotate(-20 71 88)"/><path d="M76 70 L98 50 L98 82Z" fill="#fff9b0" opacity=".35"/>`;
    s+=`<g fill="#bfe3ff"><circle cx="24" cy="80" r="2"/><circle cx="20" cy="72" r="1.5"/><circle cx="26" cy="66" r="1"/></g>`;
  }
  return s+`</svg>`;
}

/* ===================== sound ===================== */
let AC=null,master=null,muted=false,bgmOn=false,bgmTimer=null;
function audio(){
  if(AC)return; try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination);startBGM()}catch(e){}
}
function tone(f,dur,type="square",vol=.12,when=0,slide=0){
  if(!AC)return; const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0,freq=400){
  if(!AC)return; const t=AC.currentTime+when,b=AC.createBuffer(1,AC.sampleRate*dur,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type="lowpass";f.frequency.value=freq;g.gain.value=vol;
  s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const SFX={
  tap(){tone(880,.06,"square",.06)},
  ok(){tone(660,.08,"square",.08);tone(990,.12,"square",.08,.07)},
  gakon(){noise(.25,.6,0,260);tone(90,.18,"sine",.4)},
  hr(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,"square",.07,i*.08));noise(.25,.5,0,260)},
  hit(){tone(740,.08,"square",.07);noise(.2,.45,0,260)},
  out(){tone(220,.18,"sawtooth",.06,0,140)},
  bb(){tone(520,.1,"triangle",.1);tone(520,.1,"triangle",.1,.14)},
  cut(){tone(330,.5,"sawtooth",.07,0,110)},
  fail(){[392,330,262,196].forEach((f,i)=>tone(f,.22,"triangle",.12,i*.18))},
  win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.14,"square",.07,i*.1))},
  coin(){tone(1800,.05,"square",.05);tone(2400,.08,"square",.05,.05)},
};
// BGM:深夜のローファイ(Web Audioの簡易ループ。Flow MusicのBGMに差し替え予定)
function startBGM(){
  if(bgmOn||!AC)return; bgmOn=true;
  const bpm=78,beat=60/bpm; let step=0;
  const chords=[[220,277,330,415],[196,247,294,370],[175,220,262,330],[165,208,247,311]];
  const bass=[110,98,87,82];
  const bg=AC.createGain();bg.gain.value=.5;bg.connect(master);
  function pad(f,t,d,v){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=900;
    o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(lp);lp.connect(g);g.connect(bg);o.start(t);o.stop(t+d+.05)}
  function hat(t){const b=AC.createBuffer(1,AC.sampleRate*.04,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type="highpass";f.frequency.value=6000;g.gain.value=.05;s.buffer=b;s.connect(f);f.connect(g);g.connect(bg);s.start(t)}
  let next=AC.currentTime+.1;
  bgmTimer=setInterval(()=>{
    while(next<AC.currentTime+.4){
      const bar=Math.floor(step/8)%4, i=step%8;
      if(i===0)chords[bar].forEach(f=>pad(f,next,beat*4,.035));
      if(i===0||i===5)pad(bass[bar],next,beat*1.4,.12);
      if(i===3)pad(bass[bar]*1.5,next,beat*.8,.07);
      hat(next+(i%2?beat*.16:0));
      if(i===6&&bar%2===1)pad(chords[bar][3]*2,next,beat*.6,.03);
      next+=beat/2;step++;
    }
  },100);
}
const muteBtn=document.getElementById("mute");
muteBtn.onclick=e=>{e.stopPropagation();audio();muted=!muted;master&&(master.gain.value=muted?0:.7);muteBtn.textContent=muted?"×":"♪"};

/* ===================== game ===================== */
let stats;
function simulate(season){
  // 冬:来客1人につき6打席(18打席で2巡)。春:来客1人につき3打席
  const per=season==="winter"?6:3, log=[]; let bases=[0,0,0],runs=0,corn=0,byC=[0,0,0],idx=0;
  for(let c=0;c<3;c++){
    for(let k=0;k<per;k++){
      const bi=idx%9,id=lineup[bi];idx++;
      let r,why;
      const cut=season==="spring"&&CANS[id].hot;
      if(cut){r="K";why="打席に誰もいない"}
      else{
        [r,why]=TABLE[CUST[c].k][id];
        if(season==="spring"&&CUST[c].k==="kei"&&SPRING_KEI[id])[r,why]=SPRING_KEI[id];
        if(CUST[c].k==="yoi"&&k===2){r="BB";why="ボタンを押さずに自販機に話しかけた"}
      }
      let sc=0;
      if(r==="HR"){sc=1+bases.reduce((a,b)=>a+b,0);bases=[0,0,0]}
      else if(r==="H"){sc=bases[2];bases=[1,bases[0],bases[1]]}
      else if(r==="BB"){if(bases[0]){if(bases[1]){if(bases[2])sc=1;bases[2]=1}bases[1]=1}bases[0]=1}
      if(id==="pota"&&!cut&&r!=="BB")corn+=[11,13,12,14,10,12,13,11,12][idx%9];
      runs+=sc;byC[c]+=sc;
      log.push({c,bi,id,r,why,sc,runs,cut});
    }
    bases=[0,0,0]; // 来客が変わったらチェンジ
  }
  return {log,runs,corn,byC};
}
function renderBoard(season,byC,cur){
  const lbl=CUST.map(c=>c.n.slice(0,2));
  $("board").innerHTML=`<div>${season==="winter"?"1月":"3月"}</div>`+lbl.map((l,i)=>`<div class="${i===cur?"on":""}">${l}</div>`).join("")+`<div>計</div>`+
   `<div>得点</div>`+byC.map((v,i)=>`<div class="v ${i===cur?"on":""}">${v==null?"-":v}</div>`).join("")+`<div class="v">${byC.reduce((a,b)=>a+(b||0),0)}</div>`;
}
async function playSeason(season,sim,fast){
  const step=fast?60:season==="winter"?430:520;
  const byC=[null,null,null];
  $("ghead").textContent=season==="winter"?"1月 深夜 ホット販売中":"3月下旬 深夜";
  for(let c=0;c<3;c++){
    byC[c]=0;renderBoard(season,byC,c);
    $("gclk").textContent=CUST[c].t;
    const cu=$("cust");cu.innerHTML=custSVG(CUST[c].k);cu.classList.remove("in");void cu.offsetWidth;cu.classList.add("in");
    $("bub").innerHTML=season==="spring"&&CUST[c].k==="kei"?"巡回中。<br>今日はあったかいな。":CUST[c].line;
    $("res").innerHTML="";$("sys").textContent=`相手投手:${CUST[c].n}`;
    renderCase($("gcase"),season,-1);
    await sleep(fast?80:700);
    for(const e of sim.log.filter(x=>x.c===c)){
      renderCase($("gcase"),season,e.bi);
      SFX.coin();$("coin").textContent=`${e.bi+1}番 ${CANS[e.id].n} の打席`;
      await sleep(step*.45);
      const R=RES[e.r];
      $("res").className="res "+R.c;$("res").innerHTML=`${e.cut?"―":R.t}${e.sc?` +${e.sc}点`:""}<small>※${e.why}</small>`;
      if(e.r==="HR"||e.r==="H"){const t=$("tray");t.innerHTML=canSVG(e.id,season==="spring");t.classList.remove("drop");void t.offsetWidth;t.classList.add("drop");SFX.gakon();setTimeout(()=>e.r==="HR"?SFX.hr():SFX.hit(),120)}
      else if(e.r==="BB")SFX.bb();else SFX.out();
      byC[c]+=e.sc;renderBoard(season,byC,c);
      await sleep(step*.55);
    }
    await sleep(fast?50:350);
  }
  renderBoard(season,byC,-1);
}
async function runSeason(fast=window.__FAST){
  show("game");
  const w=simulate("winter");
  await playSeason("winter",w,fast);
  // ===== 春の切り替え =====
  const cutN=lineup.filter(id=>CANS[id].hot).length;
  const ov=$("ov");
  ov.innerHTML=`<div class="sakura">🌸</div><h2>3月下旬。</h2><p>オペレーターが来て、<br>全列を「つめた〜い」に切り替えた。</p>`;
  ov.classList.add("on");await sleep(fast?100:1500);ov.classList.remove("on");
  $("ghead").textContent="3月下旬 深夜";$("bub").innerHTML="…";$("res").innerHTML="";$("sys").textContent="";
  renderCase($("gcase"),"spring",-1);SFX.cut();
  $("coin").textContent=cutN?`戦力外 ${cutN}人`:"全員残留";
  await sleep(fast?100:1300);
  let s;
  if(cutN===9){
    ov.innerHTML=`<h2>没収試合</h2><p>打席に立てる缶がいない。<br>※公認野球規則により、記録は0−9。</p>`;
    ov.classList.add("on");SFX.fail();await sleep(fast?100:1900);ov.classList.remove("on");
    s={runs:0,forfeit:true,log:[]};
  }else{
    s=simulate("spring");await playSeason("spring",s,fast);
  }
  stats={w,s,cutN};
  showResult();
}

function showResult(){

    `<div class="stat"><div class="l">残塁(コーン)</div><div class="n">${w.corn}<small style="font-size:11px">粒</small></div></div>`;
  $("notices").innerHTML=lineup.map((id,i)=>CANS[id].hot?`<div class="notice">${canSVG(id,true)}<span>${i+1}番</span><span style="color:#c00">戦力外</span></div>`:"").join("")||`<div class="tsukkomi">戦力外 0人。冬の成績は${w.runs}点。</div>`;
  const tk=[];
  if(uniq===1)tk.push("※9列すべて同じ商品を補充しました");
  if(pota>0)tk.push("※コンポタは打順の概念を持ちません");
  if(pota>0)tk.push("※つめた〜いコーンポタージュは、販売を終了しました");
  if(!tk.length)tk.push(cutN===0?"※警備員:「冷たくて持てない」":"※補充担当:春の入れ替えは明日やります");
  $("tsk").innerHTML=tk.slice(0,2).join("<br>");
  const me=`<div class="r me"><span>あなた:${lineupShort()}</span><span>冬${w.runs}点/春${s.forfeit?"没収":s.runs+"点"}</span></div>`;
  $("others").innerHTML=`<b>ほかの挑戦者</b>`+me+
   `<div class="r"><span>全員おしるこ打線</span><span>受験生が全員寝落ち</span></div>`+
   `<div class="r"><span>全員エナドリ打線</span><span>午前3時に試合が終わらない</span></div>`+
   `<div class="r"><span>全員水打線</span><span>同じ顔で審判が見分けられず無効</span></div>`+
   `<div class="r"><span>1番コンポタ、2〜9番水</span><span>警備員にだけ1本売れた</span></div>`;
  show("result");
  (pota===9||cutN===0)?SFX.fail():SFX.win();
  const names=lineup.map((id,i)=>`${i+1}番${CANS[id].n}`).join("、");
  const txt=`私の深夜の自販機打線は、${names}です。記録:冬${w.runs}点。${kick}\n#sltm\n${URL_}`;
  $("share").href="https://twitter.com/intent/tweet?text="+encodeURIComponent(txt);
  $("share").onclick=()=>SFX.ok();
}

}
