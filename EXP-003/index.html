<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>終電後、相乗り。</title>
<meta property="og:title" content="終電後、相乗り。">
<meta property="og:description" content="異世界の仲間とタクシーを割り勘する。一番安く帰る方法は?">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;background:#000;font-family:"DotGothic16",monospace;color:#fff}
#app{height:100dvh;max-width:480px;margin:0 auto;position:relative;overflow:hidden;background:#06081a;
  padding:calc(env(safe-area-inset-top) + 8px) 10px calc(env(safe-area-inset-bottom) + 10px);display:flex;flex-direction:column}
.screen{display:none;flex:1;flex-direction:column;min-height:0;gap:8px}
.screen.on{display:flex}
.win{background:#0a1150;border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #0a1150,inset 0 0 0 2px #0a1150;padding:8px 10px;position:relative}
.msg{font-size:16px;line-height:1.55;min-height:62px;display:flex;align-items:center}
.msg span{white-space:pre-line}
.head{font-size:13px;color:#ffd84a;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:center;padding-right:44px;min-height:24px}
.btn{font-family:inherit;font-size:20px;color:#fff;background:#0a1150;border:3px solid #fff;border-radius:8px;padding:12px 10px;cursor:pointer;width:100%;position:relative;box-shadow:0 0 0 2px #0a1150}
.btn::before{content:"▶";position:absolute;left:14px;opacity:0}
.btn:not(:disabled)::before{opacity:1;animation:blink 1s steps(2) infinite}
.btn:disabled{color:#55608f;border-color:#55608f}
.btn:active:not(:disabled){background:#1b2a8a}
.btn.red{background:#7a1020;border-color:#ffd84a;color:#ffd84a;font-size:22px;padding:14px 10px}
.btn.red:disabled{background:#2a1020;color:#6a5050;border-color:#6a5050}
@keyframes blink{50%{opacity:0}}
#mute{position:absolute;top:calc(env(safe-area-inset-top) + 6px);right:8px;z-index:20;width:40px;height:40px;border-radius:8px;border:2px solid #fff;background:#0a1150;color:#fff;font-size:18px;font-family:inherit}
/* title */
#title{justify-content:center;gap:14px}
#title h1{font-size:44px;line-height:1.15;text-align:center;font-weight:400;text-shadow:3px 3px 0 #2a3aa8}
#title .sub{text-align:center;font-size:13px;color:#ffd84a;letter-spacing:.2em}
#titleArt{display:flex;justify-content:center;gap:2px}
#titleArt div{width:58px}
.queue{font-size:12px;color:#8f9ad0;text-align:center}
/* pick */
.party{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{background:#0a1150;border:2px solid #fff;border-radius:6px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11px;cursor:pointer;overflow:hidden;position:relative}
.slot svg{height:56px;width:auto}
.slot.empty{border-style:dashed;border-color:#55608f;color:#55608f;justify-content:center}
.slot .x{position:absolute;top:1px;right:4px;font-size:15px;color:#ffd84a}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px}
.card{background:#0a1150;border:2px solid #fff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;cursor:pointer;position:relative;padding:2px}
.card svg{flex:1;min-height:0;width:100%}
.card .nm{font-size:14px;line-height:1.1}
.card .ds{font-size:11px;color:#8f9ad0}
.card .cnt{position:absolute;top:2px;right:4px;color:#ffd84a;font-size:14px}
.card:active{background:#1b2a8a}
/* map */
.map{flex:none;height:200px;background:#050716;border:3px solid #fff;border-radius:8px;position:relative;overflow:hidden}
.map svg{width:100%;height:100%;display:block}
.meter{position:absolute;top:6px;left:8px;background:#000;border:2px solid #3a7a3a;border-radius:4px;padding:2px 8px;color:#7dff9a;font-size:18px}
.meter small{font-size:10px;color:#3a9a4a;display:block;line-height:1}
.odo{position:absolute;top:6px;right:8px;font-size:12px;color:#8f9ad0;text-align:right}
.order{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none;height:170px}
.ob{background:#0a1150;border:2px solid #fff;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;position:relative;min-height:0;overflow:hidden}
.ob svg{flex:1;min-height:0;width:100%}
.ob .d{font-size:11px;padding-bottom:3px;text-align:center;line-height:1.2}
.ob .n{position:absolute;top:3px;left:4px;background:#ffd84a;color:#0a1150;border-radius:4px;width:24px;height:24px;font-size:16px;display:none;align-items:center;justify-content:center}
.ob.set{border-color:#ffd84a}.ob.set .n{display:flex}
.est{font-size:15px;line-height:1.6}
.est b{color:#ffd84a;font-size:20px;font-weight:400}
.est .s{font-size:12px;color:#8f9ad0}
/* ride */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px}
.st{text-align:center;font-size:12px;line-height:1.35;position:relative}
.st .who{height:40px;display:flex;justify-content:center}
.st .who svg{height:40px;width:auto}
.st .pay{font-size:15px;color:#fff}
.st.off{color:#55608f}.st.off .pay{color:#8f9ad0}
.st.off .who{opacity:.35}
.st.gone .who{opacity:0}
.st.you .pay{color:#ffd84a}
.st .tag{font-size:10px;color:#ffd84a;min-height:13px}
.spacer{flex:1}
/* result */
#result{gap:6px}
#result .big{margin-right:46px}
.big{text-align:center;padding:10px 6px 8px}
.big .l{font-size:13px;color:#8f9ad0}
.big .y{font-size:46px;line-height:1.1;color:#ffd84a}
.big .h{font-size:15px;margin-top:2px}
.big .cmp{font-size:12px;color:#8f9ad0;margin-top:2px}
.title2{font-size:15px;text-align:center;color:#fff}
.title2 b{color:#ffd84a;font-weight:400}
.note{font-size:13px;color:#fff;text-align:center;line-height:1.5}
.rank{flex:none;overflow:hidden;padding:6px 8px}
#share{margin-top:auto}
.rank h3{font-size:12px;color:#ffd84a;font-weight:400;margin-bottom:3px}
.rk{display:grid;grid-template-columns:30px 70px 1fr;gap:4px;font-size:12px;line-height:1.3;padding:3px 0;border-bottom:1px dashed #2a3580;align-items:baseline}
.rk:last-child{border-bottom:none}
.rk .y{text-align:right;padding-right:6px}
.rk.me{color:#ffd84a}
.rk.dq{color:#b8c0ec}
.rk small{font-size:10px;color:#b8c0ec}
.btnrow{display:flex;gap:6px}
.btnrow .btn{font-size:15px;padding:10px 4px}
.btnrow .btn::before{display:none}
a.btn{text-decoration:none;text-align:center;display:block}
.share{background:#fff;color:#000;border-color:#fff}
</style>
</head>
<body>
<div id="app">
<button id="mute" aria-label="音">♪</button>

<section class="screen on" id="title">
  <div class="sub">EXP.003</div>
  <h1>終電後、<br>相乗り。</h1>
  <div id="titleArt"></div>
  <div class="queue">― タクシー乗り場 ―</div>
  <div class="win msg"><span>終電を のがした!
家(東6km)まで、なかまと わりかんで かえれ。</span></div>
  <button class="btn" id="startBtn">なかまを えらぶ</button>
</section>

<section class="screen" id="pick">
  <div class="head"><span>なかまを 3人 えらべ</span></div>
  <div class="party" id="party"></div>
  <div class="grid" id="grid"></div>
  <div class="win msg"><span id="pickMsg">乗り場に 並んでいるのは
いせかいの ひとびと だけだ。</span></div>
  <button class="btn" id="nextBtn" disabled>おりる じゅんばんへ</button>
</section>

<section class="screen" id="order">
  <div class="head"><span>おりる じゅんに タップ</span></div>
  <div class="map" id="map1" style="flex:1;min-height:200px"></div>
  <div class="order" id="orderRow"></div>
  <div class="win est" id="est">あなたの しはらい みこみ:<b>―</b><br><span class="s">ひとりで乗ると ¥2,900(深夜料金)</span></div>
  <button class="btn" id="goBtn" disabled>しゅっぱつ</button>
</section>

<section class="screen" id="ride">
  <div class="head"><span id="rideHead">そうこう中</span></div>
  <div class="map" id="map2" style="flex:1;min-height:200px"><div id="map2svg" style="position:absolute;inset:0"></div><div class="meter"><small>深夜 2割増</small><span id="meter">¥500</span></div><div class="odo" id="odo">走行 0.0km</div></div>
  <div class="win stat" id="stat"></div>
  <div class="win msg"><span id="rideMsg"></span></div>
  <button class="btn red" id="exitBtn">ここで おります</button>
</section>

<section class="screen" id="result">
  <div class="win big"><div class="l">あなたの しはらい</div><div class="y" id="rY"></div><div class="h" id="rH"></div><div class="cmp" id="rC"></div></div>
  <div class="title2" id="rT"></div>
  <div class="note" id="rN"></div>
  <div class="win stat" id="rStat"></div>
  <div class="win rank"><h3>ほかの ちょうせんしゃ</h3><div id="rank"></div></div>
  <a class="btn share" id="share" target="_blank" rel="noopener">Xでシェア</a>
  <div class="btnrow"><button class="btn" id="againBtn">おなじ なかまで</button><button class="btn" id="reBtn">なかまを えらびなおす</button></div>
</section>
</div>

<script>
/* ===== 現実の数字(東京23区・深夜割増) ===== */
const BASE=500, BASE_KM=0.913, STEP_KM=0.213, STEP_YEN=100, CLEAN=10000;
const HOME=[6,0];
const fareSolo=d=>BASE+(d>BASE_KM?Math.ceil((d-BASE_KM)/STEP_KM-1e-9)*STEP_YEN:0);
const SOLO=fareSolo(6); // ¥2,900

const JOBS=[
 {id:'ninja', nm:'忍者',     dir:'W',km:4, pick:'忍者「降りたら、消えます」\n(もう座っている)'},
 {id:'mahou', nm:'魔法使い', dir:'E',km:8, pick:'魔法使い「割り勘の計算は\n得意です」'},
 {id:'yusha', nm:'勇者',     dir:'N',km:3, pick:'勇者「道中、しらべたい所が\nあるのですが」'},
 {id:'souryo',nm:'僧侶',     dir:'W',km:5, pick:'僧侶「酔い覚ましの回復、\nかけられます」'},
 {id:'yoi',   nm:'酔いどれ戦士',dir:'E',km:3, pick:'酔いどれ戦士「だいじょぶ、\nだいじょぶ…うっ」'},
 {id:'uranai',nm:'占い師',   dir:'N',km:5, pick:'占い師「今宵は 西が吉と\n出ております」'},
 {id:'ginyu', nm:'吟遊詩人', dir:'W',km:2, pick:'吟遊詩人「道中、一曲いかが」\n運転手「結構です」'},
 {id:'ryu',   nm:'竜騎士',   dir:'N',km:8, pick:'竜騎士「竜は 飲んだら\n乗れないので」'},
 {id:'shonin',nm:'商人',     dir:'E',km:4, pick:'商人「割り勘の計算は\nわたしが 引き受けましょう」'}
];
const J=Object.fromEntries(JOBS.map(j=>[j.id,j]));
const dirName={N:'北',E:'東',W:'西'};
const ptOf=j=>j.dir==='N'?[0,-j.km]:j.dir==='E'?[j.km,0]:[-j.km,0];

/* ===== 絵 ===== */
function face(id){
  const skin='#f6d3b0';let body='',head=`<circle cx="32" cy="38" r="13" fill="${skin}"/>`,hat='',ex='';
  const eyes=(y=37)=>`<rect x="25" y="${y-2}" width="4" height="4" fill="#1c1a24"/><rect x="35" y="${y-2}" width="4" height="4" fill="#1c1a24"/>`;
  const mouth=(y=44)=>`<rect x="29" y="${y}" width="6" height="2" fill="#1c1a24"/>`;
  const robe=c=>`<path d="M10 64q22-14 44 0v16H10z" fill="${c}"/>`;
  switch(id){
   case 'uranai':body=robe('#5b3b8c');hat=`<path d="M16 42q0-26 16-26t16 26q-6-14-16-14t-16 14z" fill="#3e2366"/>`;
     ex=eyes()+mouth()+`<circle cx="50" cy="66" r="8" fill="#b9e6ff" stroke="#fff" stroke-width="1.5"/>`;break;
   case 'yusha':body=robe('#2f6fc0')+`<path d="M52 8v60" stroke="#c9ced8" stroke-width="5"/><path d="M46 46h12" stroke="#c99a2b" stroke-width="4"/>`;
     hat=`<path d="M18 34l3-12 5 6 4-10 4 10 5-6 4 12z" fill="#c9762b"/>`;ex=eyes()+mouth();break;
   case 'mahou':body=robe('#2b3a8c')+`<path d="M8 40v40" stroke="#8a5a2b" stroke-width="3"/><circle cx="8" cy="38" r="4" fill="#ff5ad8"/>`;hat=`<path d="M14 32h36l-14-28z" fill="#3b4abc"/><path d="M12 32h40" stroke="#3b4abc" stroke-width="4"/><circle cx="36" cy="16" r="2" fill="#ffd84a"/>`;
     ex=eyes(39)+`<path d="M24 46q8 14 16 0z" fill="#eee"/>`;break;
   case 'ginyu':body=robe('#2f8a5a')+`<ellipse cx="50" cy="66" rx="8" ry="10" fill="#c98a3b"/><path d="M50 56l6-14" stroke="#7a4a1a" stroke-width="3"/>`;
     hat=`<path d="M18 30q14-12 28 0z" fill="#2f8a5a"/><path d="M40 26q10-14 14-10" stroke="#e0473b" stroke-width="3" fill="none"/>`;ex=eyes()+`<ellipse cx="32" cy="45" rx="3" ry="2.5" fill="#1c1a24"/>`;break;
   case 'souryo':body=robe('#f2efe6')+`<path d="M32 56v24M26 64h12" stroke="#4fb3a5" stroke-width="3"/>`;
     hat=`<path d="M22 28q0-14 10-16q10 2 10 16z" fill="#f2efe6" stroke="#cfc8b6"/>`;ex=`<path d="M25 37q2-2 4 0M35 37q2-2 4 0" stroke="#1c1a24" stroke-width="2" fill="none"/>`+mouth();break;
   case 'yoi':body=robe('#8a3a2b')+`<rect x="44" y="56" width="12" height="14" rx="2" fill="#ffd84a" stroke="#fff"/><rect x="45" y="54" width="10" height="4" fill="#fff"/>`;
     head=`<circle cx="32" cy="38" r="13" fill="#f59a8a"/>`;hat=`<path d="M18 34q0-18 14-18t14 18z" fill="#9aa0ad"/><path d="M18 34h28" stroke="#6a707d" stroke-width="3"/><path d="M18 26l-8-6M46 26l8-6" stroke="#e8e8e8" stroke-width="3"/>`;
     ex=`<path d="M24 38h5M35 38h5" stroke="#1c1a24" stroke-width="2"/><path d="M28 45q4-3 8 0" stroke="#1c1a24" stroke-width="2" fill="none"/><circle cx="23" cy="43" r="2.5" fill="#e0473b" opacity=".6"/><circle cx="41" cy="43" r="2.5" fill="#e0473b" opacity=".6"/>`;break;
   case 'ninja':body=robe('#22222a');head=`<circle cx="32" cy="38" r="13" fill="#22222a"/><rect x="21" y="33" width="22" height="7" rx="3" fill="${skin}"/>`;ex=eyes(36.5);break;
   case 'ryu':body=robe('#7a2b2b')+`<path d="M44 58q10-10 14 0q-4-2-6 2q-2-4-8-2z" fill="#4fa35a"/><circle cx="54" cy="56" r="1.5" fill="#1c1a24"/>`;
     hat=`<path d="M19 34q0-16 13-16t13 16z" fill="#8a8f9c"/><path d="M19 28l-8-8 4 12zM45 28l8-8-4 12z" fill="#c9ced8"/>`;ex=eyes(39)+mouth(45);break;
   case 'shonin':body=robe('#c98a3b')+`<path d="M44 60h14v14H44z" fill="#7a4a1a"/><g fill="#ffd84a"><circle cx="48" cy="64" r="1.6"/><circle cx="53" cy="64" r="1.6"/><circle cx="48" cy="70" r="1.6"/><circle cx="53" cy="70" r="1.6"/></g>`;
     hat=`<path d="M18 30q14-14 28 0z" fill="#2f6f5a"/><path d="M16 30h32" stroke="#2f6f5a" stroke-width="3"/>`;ex=eyes()+`<path d="M26 44q6 4 12 0" stroke="#1c1a24" stroke-width="2" fill="none"/><path d="M24 48q8 6 16 0" stroke="#5a3a1a" stroke-width="3" fill="none"/>`;break;
   case 'you':body=robe('#4a4a58')+`<path d="M24 58q8 8 16 0" stroke="#8a8a98" stroke-width="2" fill="none"/>`;hat=`<path d="M19 34q0-16 13-16t13 16q-6-6-13-6t-13 6z" fill="#2a2a30"/>`;ex=eyes()+mouth(45);break;
   case 'driver':body=robe('#2b2b38')+`<path d="M32 54v20" stroke="#ffd84a" stroke-width="2"/>`;hat=`<path d="M18 30q14-12 28 0z" fill="#2b2b38"/><path d="M16 30h32" stroke="#555" stroke-width="4"/>`;ex=eyes()+`<rect x="26" y="45" width="12" height="2" fill="#1c1a24"/>`;break;
  }
  return `<svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">${body}${head}${hat}${ex}</svg>`;
}
const inner=id=>face(id).replace(/<\/?svg[^>]*>/g,'');

/* ===== 音 ===== */
let AC=null,master=null,muted=false,bgmOn=false;
function audio(){
  if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.6;master.connect(AC.destination);startBGM()}catch(e){}
}
function tone(f,dur,type='square',vol=.1,when=0,slide=0){
  if(!AC)return;const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol=.3,when=0,freq=500){
  if(!AC)return;const t=AC.currentTime+when,b=AC.createBuffer(1,Math.floor(AC.sampleRate*dur),AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=freq;g.gain.value=vol;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);
}
const SFX={
  tap(){tone(990,.05,'square',.06)},
  ok(){tone(660,.07,'square',.07);tone(990,.1,'square',.07,.07)},
  no(){tone(180,.15,'square',.07)},
  tick(){tone(2200,.03,'square',.03)},
  door(){noise(.18,.4,0,900);tone(140,.12,'sine',.25)},
  vanish(){tone(1200,.25,'triangle',.07,0,200)},
  warp(){[400,600,900,1300,1800].forEach((f,i)=>tone(f,.08,'triangle',.06,i*.05))},
  bad(){[330,262,196].forEach((f,i)=>tone(f,.2,'square',.07,i*.15))},
  vomit(){noise(.6,.5,0,300);tone(120,.5,'sawtooth',.06,0,60)},
  heal(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'triangle',.07,i*.07))},
  coin(){tone(1800,.05,'square',.05);tone(2400,.08,'square',.05,.05)},
  win(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.14,'square',.07,i*.1))},
  lose(){[392,330,262,196].forEach((f,i)=>tone(f,.25,'triangle',.1,i*.2))}
};
/* BGM:深夜のフィールド曲(Web Audioの簡易ループ。Flow MusicのBGMに差し替え予定) */
function startBGM(){
  if(bgmOn||!AC)return;bgmOn=true;
  const bpm=96,b=60/bpm;let step=0,next=AC.currentTime+.1;
  const bg=AC.createGain();bg.gain.value=.35;bg.connect(master);
  const chords=[[220,262,330],[175,220,262],[196,247,294],[165,208,247]];
  const mel=[440,0,523,494,440,0,392,0, 349,0,440,392,349,0,330,0, 392,0,494,440,392,0,330,0, 330,0,415,0,494,0,0,0];
  function n(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bg);o.start(t);o.stop(t+d+.05)}
  setInterval(()=>{
    while(next<AC.currentTime+.3){
      const bar=Math.floor(step/8)%4,c=chords[bar],s=step%8;
      if(s%2===0)n(c[0]/2,next,b*.9,'triangle',.22);
      if(s===0||s===4)c.forEach(f=>n(f,next,b*1.8,'square',.025));
      const m=mel[step%32];if(m)n(m,next,b*.45,'square',.035);
      next+=b/2;step++;
    }
  },100);
}
const muteBtn=document.getElementById('mute');
muteBtn.onclick=e=>{e.stopPropagation();audio();muted=!muted;master&&(master.gain.value=muted?0:.6);muteBtn.textContent=muted?'×':'♪'};
document.addEventListener('pointerdown',audio,{once:true});

/* ===== 共通 ===== */
const $=s=>document.getElementById(s);
const show=id=>document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
const yen=n=>(n<0?'-':'')+'¥'+Math.abs(Math.round(n)).toLocaleString();
$('titleArt').innerHTML=['ninja','yoi','mahou','souryo','ryu'].map(i=>`<div>${face(i)}</div>`).join('');
let T0=0;

/* ===== なかま選び ===== */
let picks=[];
function partyMembers(){
  const cnt={},tot={};picks.forEach(p=>tot[p]=(tot[p]||0)+1);
  const m=[{key:'you',job:'you',nm:'あなた',pt:HOME,dest:'東6km'}];
  picks.forEach(p=>{cnt[p]=(cnt[p]||0)+1;const j=J[p];
    m.push({key:p+cnt[p],job:p,nm:j.nm+(tot[p]>1?'ABC'[cnt[p]-1]:''),pt:ptOf(j),dest:dirName[j.dir]+j.km+'km'})});
  return m;
}
function renderPick(){
  const cnt={};picks.forEach(p=>cnt[p]=(cnt[p]||0)+1);
  $('grid').innerHTML=JOBS.map(j=>`<div class="card" data-id="${j.id}">${cnt[j.id]?`<span class="cnt">×${cnt[j.id]}</span>`:''}${face(j.id)}<div class="nm">${j.nm}</div><div class="ds">${dirName[j.dir]}${j.km}km</div></div>`).join('');
  const m=partyMembers();
  $('party').innerHTML=[0,1,2,3].map(i=>m[i]?`<div class="slot" data-i="${i}">${i?'<span class="x">×</span>':''}${face(m[i].job)}<span>${m[i].nm}</span></div>`:`<div class="slot empty">あき</div>`).join('');
  $('nextBtn').disabled=picks.length<3;
}
$('grid').addEventListener('click',e=>{
  const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id;
  if(picks.length<3){picks.push(id);SFX.tap();
    $('pickMsg').textContent=picks.length===3?'運転手「…で、どういう集まり?」':J[id].pick;}
  else{SFX.no();$('pickMsg').textContent='運転手「もう満員です」\n(なかまを タップで はずせる)';}
  renderPick();
});
$('party').addEventListener('click',e=>{
  const s=e.target.closest('.slot');if(!s||!s.dataset.i||s.dataset.i==='0')return;
  picks.splice(+s.dataset.i-1,1);SFX.tap();$('pickMsg').textContent='運転手「降りるの? はい」';renderPick();
});
$('startBtn').onclick=()=>{audio();SFX.ok();T0=performance.now();show('pick');renderPick()};
$('nextBtn').onclick=()=>{SFX.ok();order=[];show('order');renderOrder()};

/* ===== 地図 ===== */
// 1km = 20px。x:-6..9 / y:-8.6..1.4
const SC=20,VB=[-6*SC,-8.6*SC,15*SC,10*SC];
const P=p=>[p[0]*SC,p[1]*SC];
function mapSVG(members,orderKeys,routePts){
  let s=`<svg viewBox="${VB.join(' ')}" preserveAspectRatio="xMidYMid meet">
  <g stroke="#1a2050" stroke-width="12" stroke-linecap="round"><path d="M0 0V-170M0 0H175M0 0H-115"/></g>
  <g stroke="#3a4590" stroke-width="1.5" stroke-dasharray="4 6"><path d="M0 0V-170M0 0H175M0 0H-115"/></g>
  <g font-size="10" fill="#55608f" font-family="DotGothic16"><text x="6" y="-160">北</text><text x="170" y="16">東</text><text x="-116" y="16">西</text></g>
  <rect x="-16" y="5" width="32" height="15" rx="2" fill="#ffd84a"/><text x="0" y="16" font-size="10" text-anchor="middle" fill="#0a1150" font-family="DotGothic16">駅</text>
  <g transform="translate(${HOME[0]*SC} 0)"><path d="M-9 -2l9-9 9 9v10h-18z" fill="#fff"/><rect x="-3" y="2" width="6" height="6" fill="#0a1150"/></g>`;
  if(routePts&&routePts.length)s+=`<path d="M0 0L${routePts.map(p=>P(p).join(' ')).join('L')}" stroke="#ffd84a" stroke-width="2.5" fill="none" opacity=".55"/>`;
  const seen={};
  members.forEach(m=>{const [x,y]=P(m.pt);const k=x+','+y;const off=(seen[k]=(seen[k]||0)+1)-1;const n=orderKeys?orderKeys.indexOf(m.key):-1;
    s+=`<g transform="translate(${x-12+off*16} ${y-30})"><circle cx="12" cy="13" r="12" fill="${m.job==='you'?'#ffd84a':'#fff'}"/><g transform="translate(0 -3) scale(.375)">${inner(m.job)}</g>${n>=0?`<rect x="18" y="-6" width="12" height="12" rx="2" fill="#e0473b"/><text x="24" y="4" font-size="10" text-anchor="middle" fill="#fff" font-family="DotGothic16">${n+1}</text>`:''}</g>`;
  });
  s+=`<g id="you2" style="display:none"><circle r="9" fill="#ffd84a"/><g transform="translate(-9 -11) scale(.28)">${inner('you')}</g></g>`;
  s+=`<g id="car"><rect x="-12" y="-7" width="24" height="13" rx="3" fill="#ffd84a" stroke="#0a1150" stroke-width="1.5"/><rect x="-5" y="-11" width="10" height="5" rx="1" fill="#e0473b"/><rect x="-8" y="-4" width="16" height="4" fill="#0a1150"/></g></svg>`;
  return s;
}

/* ===== 降りる順 ===== */
let order=[],members=[];
function renderOrder(){
  members=partyMembers();
  $('orderRow').innerHTML=members.map(m=>{const n=order.indexOf(m.key);
    return `<div class="ob ${n>=0?'set':''}" data-k="${m.key}"><span class="n">${n+1}</span>${face(m.job)}<span class="d">${m.nm}<br>${m.dest}</span></div>`}).join('');
  $('map1').innerHTML=mapSVG(members,order,order.map(k=>members.find(m=>m.key===k).pt));
  $('goBtn').disabled=order.length<4;
  const b=$('est').querySelector('b');
  if(order.length===4){const r=runSim(null);b.textContent=yen(r.pay.you);}
  else b.textContent='―';
}
$('orderRow').addEventListener('click',e=>{
  const b=e.target.closest('.ob');if(!b)return;const k=b.dataset.k,i=order.indexOf(k);
  if(i>=0)order.splice(i);else order.push(k);SFX.tap();renderOrder();
});

/* ===== 割り勘エンジン(確定ルール) ===== */
function makeSim(){
  const R=members.map(m=>({...m,on:true,gone:false,paid:0,tag:''}));
  const has=job=>R.some(r=>r.on&&r.job===job);
  const S={R,pos:[0,0],odo:0,meterDist:0,nextTick:BASE_KM,meter:BASE,unpaid:0,vomit:false,healed:false,checked:0,
    youOut:false,youOdo:null,youPt:null,done:false,targets:[],ev:[],last:null};
  const on=()=>R.filter(r=>r.on);
  const say=(t,k,who)=>S.ev.push({t,k,who});
  const split=y=>{const a=on();a.forEach(r=>r.paid+=y/a.length)};
  // 初乗り
  split(BASE);
  say('運転手「出しますよ。深夜料金です」','start');
  // 魔法使い:乗った瞬間ワープ
  R.filter(r=>r.job==='mahou').forEach(r=>{r.on=false;r.gone=true;r.tag='ワープ';say(`${r.nm}は ワープで かえった!\n(初乗りぶん ${yen(r.paid)} だけ はらった)`,'warp')});
  // 経路
  const ordered=order.map(k=>R.find(r=>r.key===k)).filter(r=>r.on);
  if(R.some(r=>r.job==='uranai'&&r.on)&&!(ordered[0]&&ordered[0].pt[0]<0&&ordered[0].pt[1]===0)){
    S.targets.push({pt:[-1.5,0],r:null,uranai:true});
  }
  ordered.forEach(r=>S.targets.push({pt:r.pt,r}));
  S.has=has;S.on=on;S.say=say;S.split=split;
  return S;
}
function dropOff(S,r,atStation){
  const {say,split,on}=S;
  // 最後の一人なら清掃代
  r.on=false;
  const rest=S.on();
  if(rest.length===0&&S.vomit){r.paid+=CLEAN;r.tag='清掃代';say(`運転手「最後の方、清掃代 ${yen(CLEAN)} です」`,'clean',r.key)}
  // 商人の端数切り上げ
  const sh=S.R.find(x=>x.job==='shonin'&&(x.on||x===r));
  if(sh&&sh!==r&&r.job!=='ninja'){const up=Math.ceil(r.paid/100-1e-9)*100,d=up-r.paid;if(d>0.5){r.paid=up;sh.paid-=d;}}
  if(r.job==='ninja'){
    const s=r.paid;r.paid=0;r.gone=true;r.tag='消えた';
    if(rest.length){rest.forEach(x=>x.paid+=s/rest.length);say(`${r.nm}は 消えた!\n${yen(s)}は のこりの なかまで わりかん`,'ninja')}
    else{S.unpaid+=s;say(`${r.nm}は 消えた!\n運転手「…払ってから消えてください」`,'ninja')}
  }else if(r.job==='you'){
    S.youOut=true;S.youOdo=S.odo;S.youPt=S.pos.slice();
    const left=Math.hypot(HOME[0]-S.pos[0],HOME[1]-S.pos[1]);
    if(S.odo<0.01)say('あなたは おりた。\n運転手「…ここ、乗り場ですけど」','youout');
    else if(left<0.05)say('あなたは いえに ついた。','youout');
    else say(`あなたは おりた。\n家まで あと ${left.toFixed(1)}km`,'youout');
  }else{
    say(`${r.nm}は おりた。`,'drop');
  }
  if(rest.length===0)S.done=true;
}
// ds km すすめる。イベントがあれば true
function step(S,ds){
  if(S.done)return;
  const tg=S.targets[0];
  if(!tg){S.done=true;return}
  const dx=tg.pt[0]-S.pos[0],dy=tg.pt[1]-S.pos[1],dl=Math.hypot(dx,dy);
  const mv=Math.min(ds,dl);
  if(dl>0){S.pos[0]+=dx/dl*mv;S.pos[1]+=dy/dl*mv}
  const before=S.odo;S.odo+=mv;
  // 吟遊詩人:1〜2km はメーターが止まる
  const bard=S.has('ginyu');
  let paidMv=mv;
  if(bard){const a=Math.max(before,1),b=Math.min(S.odo,2);if(b>a)paidMv-=b-a;
    if(before<1&&S.odo>=1)S.say('吟遊詩人は うたいだした!\n運転手は メーターを とめた','bard');
    if(before<2&&S.odo>=2)S.say('運転手「…いい歌でした」\n(メーター さいかい)','bard2');}
  S.meterDist+=paidMv;
  while(S.meterDist>=S.nextTick-1e-9){S.meter+=STEP_YEN;S.split(STEP_YEN);S.nextTick+=STEP_KM;S.tickFlag=true}
  // 勇者:1kmごとに自販機をしらべる(待ち時間で+100円)
  if(S.has('yusha')&&Math.floor(S.odo+1e-9)>Math.floor(before+1e-9)){
    S.meter+=STEP_YEN;S.split(STEP_YEN);
    const n=S.R.filter(r=>r.on&&r.job==='yusha').length;
    S.say(`勇者${n>1?'たち':''}は 自販機の おつりぐちを しらべた!\n(待ち時間 メーター+${yen(STEP_YEN)})`,'yusha');
  }
  // 酔いどれ戦士:3km で吐く
  if(!S.vomit&&!S.healed&&before<3&&S.odo>=3&&S.has('yoi')){
    if(S.has('souryo')){S.healed=true;S.say('僧侶は 酔いどれ戦士を 回復した!\n(吐かずに すんだ)','heal')}
    else{S.vomit=true;S.say('酔いどれ戦士は 吐いた!\n運転手「最後に降りる方に、清掃代を」','vomit')}
  }
  if(mv>=dl-1e-9){
    S.targets.shift();
    if(tg.uranai)S.say('占い師「西が吉と 出ております」\n(西へ 1.5km よりみち)','uranai');
    else if(tg.r&&tg.r.on)dropOff(S,tg.r);
  }
}
function youExit(S){const y=S.R.find(r=>r.job==='you');if(y.on){dropOff(S,y);S.targets=S.targets.filter(t=>t.r!==y)}}
function finalize(S){
  const pay={};S.R.forEach(r=>pay[r.key]=r.paid);
  return {pay,R:S.R,unpaid:S.unpaid,vomit:S.vomit,youOdo:S.youOdo,youPt:S.youPt,events:S.ev,meter:S.meter};
}
function runSim(exitOdo){
  const S=makeSim();
  if(exitOdo===0)youExit(S);
  let g=0;while(!S.done&&g++<10000){step(S,0.01);if(exitOdo!=null&&!S.youOut&&S.odo>=exitOdo)youExit(S)}
  return finalize(S);
}

/* ===== 走行 ===== */
let SIM=null,running=false;
$('goBtn').onclick=()=>{SFX.ok();startRide()};
function renderStat(el,R){
  el.innerHTML=R.map(r=>`<div class="st ${r.on?'':'off'} ${r.gone?'gone':''} ${r.job==='you'?'you':''}"><div class="who">${face(r.job)}</div><div>${r.nm}</div><div class="pay">${r.job==='ninja'&&r.gone?'¥0':yen(r.paid)}</div><div class="tag">${r.tag||(r.on?'':'おりた')}</div></div>`).join('');
}
function startRide(){
  SIM=makeSim();show('ride');
  $('map2svg').innerHTML=mapSVG(members,order,SIM.targets.map(t=>t.pt));
  $('exitBtn').disabled=false;$('exitBtn').textContent='ここで おります';
  $('rideHead').textContent='そうこう中 ― いつでも おりられる';
  running=true;rideLoop();
}
$('exitBtn').onclick=()=>{if(!SIM||SIM.youOut)return;SFX.door();youExit(SIM);$('exitBtn').disabled=true};
async function rideLoop(){
  const car=()=>$('map2svg').querySelector('#car'),you2=()=>$('map2svg').querySelector('#you2');
  let shown=0,last=performance.now();
  const draw=()=>{const [x,y]=P(SIM.pos);car().setAttribute('transform',`translate(${x} ${y})`);
    if(SIM.youOut){const g=you2();g.style.display='';const [a,b]=P(SIM.youPt);g.setAttribute('transform',`translate(${a} ${b+14})`)}
    $('meter').textContent=yen(SIM.meter);$('odo').textContent='走行 '+SIM.odo.toFixed(1)+'km';renderStat($('stat'),SIM.R)};
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  draw();
  // 出発前の間(ここで「おります」を押せば 駅前で降りられる)
  await showEvents(draw,true);
  await sleep(SIM.youOut?200:900);
  while(!SIM.done){
    await new Promise(r=>requestAnimationFrame(r));
    const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;
    const speed=SIM.youOut?4.5:1.8; // km/秒
    let ds=speed*dt;
    while(ds>0&&!SIM.done&&SIM.ev.length===0){const d=Math.min(ds,.01);step(SIM,d);ds-=d}
    if(SIM.tickFlag){SIM.tickFlag=false;SFX.tick()}
    draw();
    if(SIM.ev.length){await showEvents(draw,false);last=performance.now()}
  }
  draw();await sleep(500);
  finish();
}
async function showEvents(draw,first){
  while(SIM.ev.length){
    const e=SIM.ev.shift();
    $('rideMsg').textContent=e.t;
    ({warp:SFX.warp,ninja:SFX.vanish,vomit:SFX.vomit,heal:SFX.heal,clean:SFX.bad,youout:SFX.door,drop:SFX.door,yusha:SFX.coin,bard:SFX.heal,uranai:SFX.tap}[e.k]||(()=>{}))();
    draw();
    const fast=SIM.youOut&&e.k!=='youout';
    await new Promise(r=>setTimeout(r,first?1100:fast?600:1000));
    if(e.k==='youout'){$('exitBtn').disabled=true;$('exitBtn').textContent='(タクシーは 走っていった)';$('rideHead').textContent='その後の タクシー'}
  }
}

/* ===== 結果 ===== */
const OTHERS=[
  {y:200,t:'駅前で降りて、乗り場の最後尾に並び直した'},
  {y:4800,t:'占い師、占い師の師匠、師匠の師匠'},
  {y:13400,t:'酔いどれ戦士×3。最後まで乗った'},
  {y:null,t:'全員ケンタウロス',dq:'乗車定員の対象外'},
  {y:null,t:'全員タクシー運転手',dq:'誰も客じゃない'}
];
let lastResult=null;
function finish(){
  const S=SIM;const res=finalize(S);const you=res.pay.you;
  const left=Math.hypot(HOME[0]-S.youPt[0],HOME[1]-S.youPt[1]);
  const atStation=S.youOdo<0.01,home=left<0.05;
  show('result');
  $('rY').textContent=yen(you);
  $('rH').textContent=home?'家に ついた':`家まで のこり ${left.toFixed(1)}km`;
  $('rC').textContent=you<SOLO?`ひとりで乗るより ${yen(SOLO-you)} おトク`:`ひとりで乗れば ${yen(SOLO)} だった`;
  let title,note;
  const paidClean=res.R.find(r=>r.job==='you').tag==='清掃代';
  if(atStation){title='駅前の覇者';note='※記録は 支払額のみで 判定します。\n帰宅は 判定に 含みません。'}
  else if(paidClean){title='最後の乗客';note='※清掃代は 最後に降りた方の お支払いです。'}
  else if(home&&you>=SOLO){title='ふつうに帰った人(割高)';note='※相乗りしないほうが 安かったようです。'}
  else if(home){title='ふつうに帰った人';note='※最初に降りる人ほど、割り勘は 安くなります。'}
  else {title='途中下車の人';note='※あなたの支払いは、降りた地点までの 割り勘です。'}
  if(res.unpaid>0)note+=`\n運転手の未収 ${yen(res.unpaid)}`;
  $('rT').innerHTML=`称号:<b>${title}</b>`;
  $('rN').textContent=note;$('rN').style.whiteSpace='pre-line';
  renderStat($('rStat'),res.R);
  // ランキング
  const meT=members.map(m=>m.nm).join('、');
  const rows=OTHERS.filter(o=>o.y!=null).map(o=>({...o}));
  rows.push({y:you,t:'あなた:'+members.slice(1).map(m=>m.nm).join('、')+(atStation?'(駅前で降りた)':home?'':'(途中で降りた)'),me:true});
  rows.sort((a,b)=>a.y-b.y||(a.me?-1:1));
  let html=rows.map((r,i)=>`<div class="rk ${r.me?'me':''}"><span>${i+1}位</span><span class="y">${yen(r.y)}</span><span>${r.t}</span></div>`).join('');
  html+=OTHERS.filter(o=>o.y==null).map(o=>`<div class="rk dq"><span>失格</span><span class="y">¥0</span><span>${o.t} <small>※${o.dq}</small></span></div>`).join('');
  $('rank').innerHTML=html;
  const myRank=rows.findIndex(r=>r.me)+1;
  (myRank===1?SFX.win:you>SOLO?SFX.lose:SFX.ok)();
  // 共有
  const ochi=atStation?'家に帰らないのが最安でした。':paidClean?'家に着いたのに、清掃代を払いました。':home?(you<SOLO?'ちゃんと家に帰りました。':'ひとりで乗ったほうが安かった。'):`家まであと${left.toFixed(1)}km、歩いてます。`;
  const txt=`私の終電後パーティーは、${members.map(m=>m.nm).join('、')}です。記録:${yen(you)}(${home?'家に着いた':'家まで残り'+left.toFixed(1)+'km'})。${ochi}\n#sltm https://saltums.github.io/sltm-lab/EXP-003/`;
  $('share').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(txt);
  lastResult={you,left,atStation,home,title,txt,ms:Math.round(performance.now()-T0),unpaid:res.unpaid};
  window.__result=lastResult;
}
$('againBtn').onclick=()=>{SFX.ok();T0=performance.now();order=[];show('order');renderOrder()};
$('reBtn').onclick=()=>{SFX.ok();T0=performance.now();picks=[];show('pick');renderPick()};
$('share').addEventListener('click',()=>SFX.coin());
</script>
